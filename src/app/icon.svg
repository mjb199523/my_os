<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Core Hexagon Gradient -->
    <linearGradient id="coreGrad" x1="160" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Lightning / Check Accent Gradient -->
    <linearGradient id="accentGrad" x1="200" y1="180" x2="320" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Orbiting Productivity Ring -->
  <circle cx="256" cy="256" r="170" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="320 60 120 40" stroke-linecap="round" opacity="0.85" />
  
  <!-- Outer Glow Nodes -->
  <circle cx="396" cy="180" r="10" fill="#38BDF8" />
  <circle cx="116" cy="332" r="8" fill="#818CF8" />

  <!-- Central Work Hexagon / Command Nexus -->
  <polygon points="256,128 366,192 366,320 256,384 146,320 146,192" fill="url(#coreGrad)" stroke="#60A5FA" stroke-width="6" stroke-linejoin="round" />

  <!-- Inner Geometric Layer -->
  <polygon points="256,132 362,194 256,256" fill="rgba(255, 255, 255, 0.18)" />
  <polygon points="150,194 256,132 256,256" fill="rgba(255, 255, 255, 0.08)" />
  <polygon points="150,194 256,256 150,316" fill="rgba(0, 0, 0, 0.15)" />
  <polygon points="362,194 362,316 256,256" fill="rgba(0, 0, 0, 0.25)" />
  <polygon points="256,256 362,316 256,380" fill="rgba(0, 0, 0, 0.35)" />
  <polygon points="150,316 256,256 256,380" fill="rgba(0, 0, 0, 0.2)" />

  <!-- Bold Minimalist 'W' Monogram -->
  <path d="M 196 216 L 226 312 L 256 252 L 286 312 L 316 216" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Dynamic Pulse Core Dot -->
  <circle cx="256" cy="216" r="8" fill="#38BDF8" />
</svg>
